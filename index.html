<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلیر موزیک شخصی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .player-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .album-art {
            width: 250px;
            height: 250px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 15px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            position: relative;
            overflow: hidden;
        }

        .album-art::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>') center/50px no-repeat;
            opacity: 0.3;
        }

        .song-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .song-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .artist-name {
            font-size: 16px;
            opacity: 0.8;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.8;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .play-btn {
            width: 70px;
            height: 70px;
            font-size: 30px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .volume-slider {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .playlist {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .playlist-item {
            background: rgba(255, 255, 255, 0.1);
            margin: 5px 0;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .playlist-item.active {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
        }

        .file-input {
            display: none;
        }

        .add-music-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 15px;
            width: 100%;
            transition: transform 0.3s;
        }

        .add-music-btn:hover {
            transform: translateY(-2px);
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 12px;
            line-height: 1.5;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="album-art" id="albumArt">🎵</div>
        
        <div class="song-info">
            <div class="song-title" id="songTitle">آهنگی انتخاب نشده</div>
            <div class="artist-name" id="artistName">-</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="prevBtn">⏮</button>
            <button class="control-btn play-btn" id="playBtn">▶</button>
            <button class="control-btn" id="nextBtn">⏭</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
        </div>

        <input type="file" class="file-input" id="fileInput" accept="audio/*" multiple>
        <button class="add-music-btn" onclick="document.getElementById('fileInput').click()">
            ➕ اضافه کردن آهنگ
        </button>

        <div class="playlist" id="playlist"></div>

        <div class="instructions">
            <strong>راهنمای استفاده:</strong><br>
            1. روی دکمه "اضافه کردن آهنگ" کلیک کنید<br>
            2. فایل‌های موزیک خود را انتخاب کنید<br>
            3. از پلیر لذت ببرید! 🎵<br><br>
            <strong>نکته:</strong> آهنگ‌ها فقط در مرورگر شما ذخیره می‌شوند
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        class MusicPlayer {
            constructor() {
                this.audio = document.getElementById('audioPlayer');
                this.playlist = [];
                this.currentIndex = 0;
                this.isPlaying = false;
                
                this.initializeElements();
                this.bindEvents();
                this.loadFromStorage();
            }

            initializeElements() {
                this.playBtn = document.getElementById('playBtn');
                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.progressBar = document.getElementById('progressBar');
                this.progress = document.getElementById('progress');
                this.currentTimeEl = document.getElementById('currentTime');
                this.durationEl = document.getElementById('duration');
                this.volumeSlider = document.getElementById('volumeSlider');
                this.fileInput = document.getElementById('fileInput');
                this.playlistEl = document.getElementById('playlist');
                this.songTitle = document.getElementById('songTitle');
                this.artistName = document.getElementById('artistName');
                this.albumArt = document.getElementById('albumArt');
            }

            bindEvents() {
                this.playBtn.addEventListener('click', () => this.togglePlay());
                this.prevBtn.addEventListener('click', () => this.previousTrack());
                this.nextBtn.addEventListener('click', () => this.nextTrack());
                this.progressBar.addEventListener('click', (e) => this.seek(e));
                this.volumeSlider.addEventListener('input', (e) => this.setVolume(e.target.value));
                this.fileInput.addEventListener('change', (e) => this.addFiles(e.target.files));
                
                this.audio.addEventListener('timeupdate', () => this.updateProgress());
                this.audio.addEventListener('loadedmetadata', () => this.updateDuration());
                this.audio.addEventListener('ended', () => this.nextTrack());
            }

            addFiles(files) {
                Array.from(files).forEach(file => {
                    if (file.type.startsWith('audio/')) {
                        const url = URL.createObjectURL(file);
                        const song = {
                            title: file.name.replace(/\.[^/.]+$/, ""),
                            artist: "نامشخص",
                            url: url,
                            file: file
                        };
                        this.playlist.push(song);
                    }
                });
                this.renderPlaylist();
                this.saveToStorage();
                
                if (this.playlist.length === 1) {
                    this.loadTrack(0);
                }
            }

            renderPlaylist() {
                this.playlistEl.innerHTML = '';
                this.playlist.forEach((song, index) => {
                    const item = document.createElement('div');
                    item.className = `playlist-item ${index === this.currentIndex ? 'active' : ''}`;
                    item.innerHTML = `
                        <div style="font-weight: bold;">${song.title}</div>
                        <div style="font-size: 12px; opacity: 0.8;">${song.artist}</div>
                    `;
                    item.addEventListener('click', () => this.loadTrack(index));
                    this.playlistEl.appendChild(item);
                });
            }

            loadTrack(index) {
                if (index >= 0 && index < this.playlist.length) {
                    this.currentIndex = index;
                    const song = this.playlist[index];
                    
                    this.audio.src = song.url;
                    this.songTitle.textContent = song.title;
                    this.artistName.textContent = song.artist;
                    this.albumArt.textContent = song.title.charAt(0).toUpperCase();
                    
                    this.renderPlaylist();
                }
            }

            togglePlay() {
                if (this.playlist.length === 0) return;
                
                if (this.isPlaying) {
                    this.audio.pause();
                    this.playBtn.textContent = '▶';
                    this.isPlaying = false;
                } else {
                    this.audio.play();
                    this.playBtn.textContent = '⏸';
                    this.isPlaying = true;
                }
            }

            previousTrack() {
                if (this.playlist.length === 0) return;
                const newIndex = (this.currentIndex - 1 + this.playlist.length) % this.playlist.length;
                this.loadTrack(newIndex);
                if (this.isPlaying) {
                    setTimeout(() => this.audio.play(), 100);
                }
            }

            nextTrack() {
                if (this.playlist.length === 0) return;
                const newIndex = (this.currentIndex + 1) % this.playlist.length;
                this.loadTrack(newIndex);
                if (this.isPlaying) {
                    setTimeout(() => this.audio.play(), 100);
                }
            }

            seek(e) {
                const rect = this.progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                this.audio.currentTime = percent * this.audio.duration;
            }

            setVolume(value) {
                this.audio.volume = value / 100;
            }

            updateProgress() {
                if (this.audio.duration) {
                    const percent = (this.audio.currentTime / this.audio.duration) * 100;
                    this.progress.style.width = percent + '%';
                    this.currentTimeEl.textContent = this.formatTime(this.audio.currentTime);
                }
            }

            updateDuration() {
                this.durationEl.textContent = this.formatTime(this.audio.duration);
            }

            formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            saveToStorage() {
                // Note: در محیط واقعی، فایل‌ها نمی‌توانند در localStorage ذخیره شوند
                // این قسمت فقط برای نمایش است
                const playlistData = this.playlist.map(song => ({
                    title: song.title,
                    artist: song.artist
                }));
                localStorage.setItem('musicPlaylist', JSON.stringify(playlistData));
            }

            loadFromStorage() {
                // در نسخه واقعی، این قسمت فایل‌ها را بازیابی می‌کند
                const savedPlaylist = localStorage.getItem('musicPlaylist');
                if (savedPlaylist) {
                    // این فقط برای نمایش است - فایل‌های واقعی بازیابی نمی‌شوند
                }
            }
        }

        // Initialize the music player
        const player = new MusicPlayer();
    </script>
</body>
</html>
