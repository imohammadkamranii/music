<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پخش‌کننده موسیقی شیک</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vazir-font@33.0.0/dist/font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background: linear-gradient(to bottom right, #1e3a8a, #4ade80);
            font-family: 'Vazir', 'Poppins', sans-serif;
            color: white;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .music-container {
            max-width: 600px;
            width: 100%;
            padding: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .music-body {
            position: relative;
        }
        .top-icons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .music-img img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin: 0 auto 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .music-info h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .music-progress {
            margin: 20px 0;
        }
        .progress-bar {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            height: 5px;
            position: relative;
        }
        .progress-line {
            background: #4ade80;
            height: 100%;
            width: 0;
            border-radius: 5px;
            transition: width 0.1s linear;
        }
        .progress {
            width: 100%;
            -webkit-appearance: none;
            height: 5px;
            background: transparent;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .progress::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .duration {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .music-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .main-controls {
            display: flex;
            gap: 20px;
        }
        .btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s;
        }
        .btn:hover {
            color: #4ade80;
        }
        .playpause {
            background: #4ade80;
            border-radius: 50%;
            padding: 15px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .playpause:hover {
            background: #22c55e;
        }
        .volume-slider {
            position: absolute;
            top: 50px;
            left: 20px;
            width: 120px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
            display: none;
        }
        .volume-slider.show {
            display: block;
        }
        .volumerange {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }
        .volumerange::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
        }
        .bar {
            background: #4ade80;
            height: 4px;
            border-radius: 5px;
            width: 100%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }
        .songs-list {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            transition: right 0.3s ease;
            overflow-y: auto;
        }
        .songs-list.showlist {
            right: 0;
        }
        .list-close {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        .song-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
        }
        .song-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .song-item.active {
            background: rgba(74, 222, 128, 0.4);
        }
        .song-number {
            width: 30px;
            text-align: center;
            font-weight: bold;
        }
        .song-title {
            flex-grow: 1;
            text-align: right;
        }
        .error-message {
            color: #ff4444;
            font-weight: bold;
            padding: 10px;
        }
        .color {
            color: #4ade80 !important;
        }
    </style>
</head>
<body>
    <div class="music-container">
        <div class="music-body">
            <div class="layer volume-slider">
                <div class="bar"></div>
                <input type="range" min="0.01" max="1" value="1" step="0.01" class="volumerange" id="volumeRange"/>
            </div>
            <div class="top-icons">
                <button class="volume btn" id="volume">
                    <i id="volumeicon" class="fas fa-volume-up"></i>
                </button>
                <button class="list btn" id="list">
                    <i class="fas fa-list"></i>
                </button>
            </div>
            <div class="music-img">
                <img src="https://images.genius.com/ee202c6f724ffd4cf61bd01a205eeb47.1000x1000x1.jpg" alt="song-images" id="img">
            </div>
            <div class="music-info">
                <h2 id="title">در حال بارگذاری...</h2>
            </div>
            <audio id="audio"></audio>
            <div class="music-progress">
                <div class="progress-bar">
                    <span class="progress-line"></span>
                    <input type="range" min="0" max="100" value="0" class="progress" id="progress"/>
                </div>
                <div class="duration">
                    <span class="current-time">00:00</span>
                    <span class="duration-time">00:00</span>
                </div>
            </div>
            <div class="music-controls">
                <button class="repeat btn" id="repeat">
                    <i class="fas fa-redo-alt"></i>
                </button>
                <div class="main-controls">
                    <button class="prevbtn btn" id="prevbtn">
                        <i class="fas fa-backward"></i>
                    </button>
                    <button class="playpause btn" id="playpause">
                        <i id="playpause-btn" class="fas fa-play"></i>
                    </button>
                    <button class="nextbtn btn" id="nextbtn">
                        <i class="fas fa-forward"></i>
                    </button>
                </div>
                <button class="like btn" id="like">
                    <i id="likeicon" class="far fa-heart"></i>
                </button>
            </div>
            <div class="songs-list" id="songs-list">
                <button class="list-close btn" id="listclose">
                    <i class="fas fa-times"></i>
                </button>
                <div id="song-items">در حال بارگذاری آهنگ‌ها...</div>
            </div>
        </div>
    </div>
    <script>
        const img = document.querySelector("#img");
        const playPause = document.querySelector("#playpause");
        const playPauseBtn = document.querySelector("#playpause-btn");
        const audio = document.querySelector("#audio");
        const title = document.querySelector("#title");
        const prevBtn = document.querySelector("#prevbtn");
        const nextBtn = document.querySelector("#nextbtn");
        const progress = document.querySelector("#progress");
        const progressLine = document.querySelector(".progress-line");
        const currTime = document.querySelector(".current-time");
        const totalDuration = document.querySelector(".duration-time");
        const volume = document.querySelector("#volume");
        const layer = document.querySelector(".layer");
        const volBar = document.querySelector(".bar");
        const volumeRange = document.querySelector("#volumeRange");
        const repeatBtn = document.querySelector("#repeat");
        const likeBtn = document.querySelector("#like");
        const likeIcon = document.querySelector("#likeicon");
        const songListBtn = document.querySelector("#list");
        const songList = document.querySelector("#songs-list");
        const listCloseBtn = document.querySelector("#listclose");
        const songItems = document.querySelector("#song-items");

        // آرایه پیش‌فرض برای مواقع خطا
        const fallbackSongs = [
            {
                path: "https://ts17.tarafdari.com/contents/user851537/content-sound/ho3ein-038.mp3",
                displayName: "هو سین",
                artist: "ناشناس",
                cover: "https://via.placeholder.com/150"
            }
        ];

        // متغیر برای ذخیره آهنگ‌ها
        let songs = [];
        let songIndex = 0;
        let isPlaying = false;

        // تابع برای بارگذاری آهنگ‌ها از songs.json
        async function loadSongs() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/yourusername/your-repo/main/songs.json'); // مسیر واقعی را وارد کنید
                if (!response.ok) throw new Error(`خطا در بارگذاری songs.json: ${response.status}`);
                songs = await response.json();
                if (!Array.isArray(songs) || songs.some(song => !song.path || !song.displayName || !song.cover)) {
                    throw new Error('فرمت داده‌های آهنگ نامعتبر است');
                }
                if (songs.length === 0) {
                    songs = fallbackSongs;
                }
                loadSong(songs[songIndex]);
                populateSongList();
            } catch (error) {
                console.error('خطا در بارگذاری آهنگ‌ها:', error);
                songs = fallbackSongs;
                loadSong(songs[songIndex]);
                populateSongList();
                songItems.innerHTML = `<div class="error-message">خطا در بارگذاری آهنگ‌ها: ${error.message}</div>`;
            }
        }

        // تابع برای پر کردن لیست آهنگ‌ها
        function populateSongList() {
            songItems.innerHTML = '';
            songs.forEach((song, index) => {
                const li = document.createElement('div');
                li.className = 'song-item';
                li.innerHTML = `<div class="song-number">${index + 1}</div><div class="song-title">${song.displayName} - ${song.artist}</div>`;
                li.addEventListener('click', () => {
                    songIndex = index;
                    loadSong(songs[songIndex]);
                    playSong();
                    songList.classList.remove('showlist');
                    document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
                    li.classList.add('active');
                });
                songItems.appendChild(li);
            });
        }

        // تابع برای پخش آهنگ
        function playSong() {
            isPlaying = true;
            playPauseBtn.classList.replace("fa-play", "fa-pause");
            audio.play().catch(err => {
                console.error('خطا در پخش:', err);
                songItems.innerHTML = `<div class="error-message">خطا در پخش آهنگ "${songs[songIndex].displayName}": ${err.message}</div>`;
            });
        }

        // تابع برای توقف آهنگ
        function pauseSong() {
            isPlaying = false;
            playPauseBtn.classList.replace("fa-pause", "fa-play");
            audio.pause();
        }

        // تابع برای بارگذاری آهنگ
        function loadSong(song) {
            img.src = song.cover;
            title.textContent = `${song.displayName} - ${song.artist}`;
            audio.src = song.path;
        }

        // تابع برای آهنگ قبلی
        function prevSong() {
            songIndex--;
            if (songIndex < 0) {
                songIndex = songs.length - 1;
            }
            loadSong(songs[songIndex]);
            playSong();
            updateActiveSong();
        }

        // تابع برای آهنگ بعدی
        function nextSong() {
            songIndex++;
            if (songIndex > songs.length - 1) {
                songIndex = 0;
            }
            loadSong(songs[songIndex]);
            playSong();
            updateActiveSong();
        }

        // تابع برای به‌روزرسانی آهنگ فعال در لیست
        function updateActiveSong() {
            document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
            const items = document.querySelectorAll('.song-item');
            if (items[songIndex]) {
                items[songIndex].classList.add('active');
            }
        }

        // تابع برای به‌روزرسانی نوار پیشرفت
        function updateProgress(e) {
            if (isPlaying) {
                const { duration, currentTime } = e.target;
                const progressPercent = (currentTime / duration) * 100;
                progress.value = progressPercent;
                progressLine.style.width = `${progressPercent}%`;
                if (progressPercent === 100) {
                    return nextSong();
                }
                const durationMinutes = Math.floor(duration / 60);
                let durationSeconds = Math.floor(duration % 60);
                if (durationSeconds < 10) {
                    durationSeconds = `0${durationSeconds}`;
                }
                if (durationSeconds) {
                    totalDuration.textContent = `${durationMinutes}:${durationSeconds}`;
                }
                let currentMinutes = Math.floor(currentTime / 60);
                let currentSeconds = Math.floor(currentTime % 60);
                if (currentSeconds < 10) {
                    currentSeconds = `0${currentSeconds}`;
                }
                currTime.textContent = `${currentMinutes}:${currentSeconds}`;
            }
        }

        // تابع برای جابجایی در نوار پیشرفت
        function progressSlide(e) {
            const { value } = e.target;
            const progressTime = Math.ceil((audio.duration / 100) * value);
            audio.currentTime = progressTime;
            if (!isPlaying) {
                progressLine.style.width = `${value}%`;
            }
        }

        // تابع برای کنترل ولوم
        function volumeBar() {
            layer.classList.toggle('show');
            setTimeout(() => {
                if (layer.classList.contains("show")) {
                    layer.classList.remove("show");
                }
            }, 5000);
        }

        // تابع برای تنظیم ولوم
        function setVolume() {
            audio.volume = volumeRange.value;
            const barWidth = (volumeRange.value / 1) * 100;
            volBar.style.width = `${barWidth}%`;
        }

        // تابع برای تکرار آهنگ
        function repeat() {
            repeatBtn.classList.toggle('color');
            audio.loop = repeatBtn.classList.contains("color");
        }

        // تابع برای لایک کردن
        function like() {
            if (likeBtn.classList.toggle('color')) {
                likeIcon.classList.replace('far', 'fas');
            } else {
                likeIcon.classList.replace('fas', 'far');
            }
        }

        // تابع برای نمایش/مخفی کردن لیست آهنگ‌ها
        function musicList() {
            songList.classList.toggle("showlist");
        }

        // رویدادها
        playPause.addEventListener("click", () => (isPlaying ? pauseSong() : playSong()));
        prevBtn.addEventListener("click", prevSong);
        nextBtn.addEventListener("click", nextSong);
        audio.addEventListener("timeupdate", updateProgress);
        progress.addEventListener("input", progressSlide);
        volume.addEventListener("click", volumeBar);
        volumeRange.addEventListener("input", setVolume);
        repeatBtn.addEventListener("click", repeat);
        likeBtn.addEventListener("click", like);
        songListBtn.addEventListener("click", musicList);
        listCloseBtn.addEventListener("click", () => songList.classList.remove("showlist"));

        // بارگذاری اولیه آهنگ‌ها
        loadSongs();
    </script>
</body>
</html>
