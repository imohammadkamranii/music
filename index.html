<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Music Player</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom right, #1e3a8a, #4ade80);
            font-family: 'Poppins', sans-serif;
            color: white;
            padding: 20px;
        }
        .player-container {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .player-header {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .audio-player {
            width: 100%;
            margin: 15px 0;
            outline: none;
        }
        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .song-item {
            padding: 10px 15px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        .song-item:hover {
            background: rgba(0, 0, 0, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .song-number {
            width: 30px;
            text-align: center;
            font-weight: bold;
            margin-right: 10px;
        }
        .song-title {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="player-header">🎵 My Stylish Music Player 🎵</div>
        <audio id="audioPlayer" controls class="audio-player"></audio>
        <ul id="songList" class="song-list"></ul>
    </div>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const songList = document.getElementById('songList');

        // Example song list, replace with your songs folder
        const songs = [
            "songs/song1.mp3",
            "songs/song2.mp3",
            "songs/song3.mp3"
        ];

        songs.forEach((songSrc, index) => {
            const songName = songSrc.split('/').pop().replace('.mp3', '');
            const li = document.createElement('li');
            li.className = 'song-item';

            const number = document.createElement('div');
            number.className = 'song-number';
            number.textContent = index + 1;

            const title = document.createElement('div');
            title.className = 'song-title';
            title.textContent = songName;

            li.appendChild(number);
            li.appendChild(title);

            li.addEventListener('click', () => {
                audioPlayer.src = songSrc;
                audioPlayer.play();
            });

            songList.appendChild(li);
        });
    </script>
</body>
</html>
